<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/deeya.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deeya Pandey — Junior .NET Developer from Nepal building practical web applications with .NET, C#, React, Next.js and SQL Server."
    />
    <meta name="theme-color" content="#0d7a52" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070c0a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Deeya Pandey — .NET Developer" />
    <meta
      property="og:description"
      content="Junior .NET Developer from Nepal building practical web applications."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before paint so the first frame is never the wrong theme.
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);

        if (isDark) document.documentElement.classList.add("dark");

        // Gates the scroll-reveal hidden state on JS actually running.
        document.documentElement.classList.add("js");
      })();
    </script>

    <title>Deeya Pandey — .NET Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
